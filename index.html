<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="stylesheet" href="style.css"><title>муравей tools</title></head>
<body>
<header>
  <div class="brand"><div class="logo">🐜</div><div><b>муравей tools</b><small>by Filipp · GORODOT technology</small></div></div>

<main id="main"></main>
<button id="fab">＋</button>
<div id="sheet" class="hidden"></div>

  </div>
</div>
<div id="toast" class="hidden"></div>
<script src="app.js"></script>
</body></html>
